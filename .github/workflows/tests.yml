name: Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  deterministic-tests:
    runs-on: ubuntu-latest

    env:
      # Deterministic tests do not call the real LLM,
      # but the current LLM client validates this variable at import time.
      SILICONFLOW_API_KEY: dummy-ci-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check dependency consistency
        run: |
          python -m pip check

      - name: Run deterministic test suite
        run: |
          python -m pytest test -q \
            -m "not integration and not llm and not slow"